# Text for the tutorial notebooks, one block per official UN language.
#
# Every language carries the same keys; tutorials/build.py refuses to build one
# that does not. Values the harness reads -- role names, item names, option
# strings -- are not here, because they are data rather than language and must
# stay as the schema spells them.
#
# The English block is the source. The other five are translations of it. To
# change the tutorial, change the text here and run:
#
#     python tutorials/build.py
#
# Anything holding a %% conversion (lbl_narrower, lbl_equivalent) must keep the
# same conversions in the same order as English: the arguments are positional.

# ----------------------------------------------------------------------
