    现在抽取这 300 次访谈，把三个数字都算出来。

    “只做访谈”的区间就是教科书上的那个。预测驱动区间则是模型在你**没有**访谈的
    住户上的平均值，再用模型在你已访谈住户上的平均误差加以校正：

    ```
    估计 = 均值(预测 | 未访谈) - [ 均值(预测 | 已访谈) - 均值(回答 | 已访谈) ]
                  ↑ 到处使用的模型            ↑ 实测出的模型误差
    ```

    方括号里的这一项就是全部的安全机制。它由真实回答算出，因此要花掉真实的访谈，
    并且无论模型的偏误是什么，它都会把偏误消掉。
