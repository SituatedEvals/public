    ### التسجيل

    خط الأساس الجماعي: كل مستجيب محجوب يأخذ النسب الممهَّدة لكل بند، متجاهلًا كل ما
    يخص الفرد. والمقياس `skill` يساوي صفرًا للتخمين المنتظم وواحدًا للكمال، وهو ما
    يرتّب عليه جدول النتائج.
